<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Live positions of the TDI-Brooks International research vessel fleet."
    />
    <title>TDI-Brooks Fleet Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Roboto:ital,wght@0,400;0,500;0,600;1,400&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>TDI-Brooks <span>Fleet</span></h1>
        <div class="sub">Last reported positions for five research vessels · UTC</div>
        <div class="hdr-right">
          <button id="fitBtn" type="button">Show whole fleet</button>
          <button
            id="listBtn"
            type="button"
            aria-controls="vessels"
            aria-expanded="true"
            aria-label="Vessel list"
            title="Show or hide the vessel list"
          >
            <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14" />
            </svg>
          </button>
        </div>
      </header>
      <div class="main">
        <div class="chart" id="chart">
          <svg
            id="map"
            role="img"
            aria-label="Chart showing last reported positions of the TDI-Brooks fleet"
          ></svg>
          <div class="zoom">
            <button id="zin" type="button" aria-label="Zoom in">+</button
            ><button id="zout" type="button" aria-label="Zoom out">−</button
            ><button
              id="zfit"
              type="button"
              aria-label="Show whole fleet"
              title="Show whole fleet"
            >
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" />
              </svg>
            </button>
          </div>
          <label class="photo-toggle"
            ><input type="checkbox" id="cardToggle" />
            <span id="cardToggleText">Ship photos</span></label
          >
          <div id="callouts"></div>
          <div class="marketing-badge">
            <b>TDI-Brooks Fleet</b
            ><span id="marketingBadge">Loading positions…</span>
          </div>
          <div class="scale-note" id="scaleNote">
            Mercator · drag to pan, scroll to zoom
          </div>
        </div>
        <aside id="vessels">
          <div class="feed" id="feed">
            <span class="dot"></span><span>Loading positions…</span>
          </div>
          <div class="list" id="list"></div>
          <div class="foot">
            Positions refresh every few minutes. A vessel whose position is more
            than two days old stops pulsing on the map.
          </div>
        </aside>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"
      integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67"
      crossorigin="anonymous"
    ></script>
    <!-- plain scripts sharing globals: order matters, app.js starts everything -->
    <script src="scripts/fleet.js"></script>
    <script src="scripts/places.js"></script>
    <script src="scripts/map.js"></script>
    <script src="scripts/cards.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
